name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas con cobertura
        run: npx jest --coverage --coverageReporters=text --coverageReporters=text-summary

  build-and-push:
    name: Construir y publicar imagen Docker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build y push de la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            cinthya25/pasteleria-api:latest
            cinthya25/pasteleria-api:${{ github.sha }}

  deploy:
    name: Desplegar en AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            docker pull cinthya25/pasteleria-api:latest
            docker stop webapp-container || true
            docker rm webapp-container || true
            docker run -d -p 80:80 -p 6061:6061 --name webapp-container --restart unless-stopped cinthya25/pasteleria-api:latest
